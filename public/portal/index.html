<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Cliente - MK-Edge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #1e40af;
        }
        
        body {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .portal-card {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .portal-card i {
            font-size: 5rem;
            color: var(--primary);
            margin-bottom: 30px;
        }
        
        .portal-card h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--primary);
        }
        
        .btn-custom {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            margin: 10px;
            transition: all 0.3s;
        }
        
        .btn-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="portal-card">
            <i class="fas fa-tools"></i>
            <h1>Portal do Cliente</h1>
            <p class="lead text-muted mb-4">
                Área exclusiva para gerenciar sua assinatura, faturas e configurações.
            </p>
            
            <div class="alert alert-info mb-4">
                <i class="fas fa-info-circle me-2"></i>
                <strong>Em Desenvolvimento</strong><br>
                Esta funcionalidade estará disponível em breve!
            </div>
            
            <p class="text-muted mb-4">
                Enquanto isso, você pode:
            </p>
            
            <div class="d-grid gap-3">
                <a href="/" class="btn btn-custom">
                    <i class="fas fa-home me-2"></i>Voltar para Home
                </a>
                <a href="/admin/" class="btn btn-outline-primary btn-custom" style="background: white; color: var(--primary);">
                    <i class="fas fa-user-shield me-2"></i>Acessar Painel Admin
                </a>
            </div>
            
            <div class="mt-5">
                <p class="text-muted small mb-2">Precisa de ajuda?</p>
                <p class="text-muted small">
                    <i class="fas fa-envelope me-2"></i>suporte@mkedge.com.br<br>
                    <i class="fas fa-phone me-2"></i>(11) 99999-9999
                </p>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
